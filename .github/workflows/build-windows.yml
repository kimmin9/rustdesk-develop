name: Build Windows

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # --- 1. 캐시 및 환경 설정 ---
      - name: vcpkg Cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_COMMIT_ID }}

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # --- 2. RustDesk 전용 엔진 교체 및 vcpkg 설정 ---
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $enginePath = "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/"
          mv -Force windows-x64-release/* $enginePath
        shell: pwsh

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Install vcpkg dependencies
        run: |
          C:\vcpkg\vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
        shell: pwsh

      # --- 3. RustDesk 빌드 (이 단계에서 exe가 생성됨) ---
      - name: Build rustdesk
        run: |
          # --skip-portable-pack 옵션을 추가하여 에러가 발생하는 구간을 건너뜁니다.
          python3 .\build.py --flutter --skip-portable-pack
        shell: pwsh

      # --- 4. Inno Setup을 이용한 설치 파일(.exe) 제작 ---
      - name: Install Inno Setup
        run: choco install innosetup
        shell: pwsh

      - name: Compile Setup Installer
        run: |
          # setup.iss 파일이 루트에 있다면 아래 명령어가 작동합니다.
          # 만약 파일을 이동하지 않았다면 .github/workflows/setup.iss 로 경로를 수정해야 합니다.
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
        shell: pwsh

      # --- 5. 최종 결과물 업로드 ---
      - name: Upload Final Setup
        uses: actions/upload-artifact@v4
        with:
          name: Custom-RustDesk-Installer
          path: CustomRustDesk_Setup.exe
