name: Build Windows

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # --- 캐시 및 의존성 설정 (최적화 버전) ---
      - name: vcpkg Cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_COMMIT_ID }}

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Install vcpkg dependencies
        run: |
          C:\vcpkg\vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
        shell: pwsh

      # --- 빌드 단계 ---
      - name: Build rustdesk
        run: |
          python3 .\build.py --flutter
        shell: pwsh

      # --- 설치 파일 생성 (Inno Setup) ---
      - name: Install Inno Setup
        run: choco install innosetup
        shell: pwsh

      - name: Compile Setup Installer
        run: |
          # ISCC를 사용하여 setup.iss 빌드
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
        shell: pwsh

      - name: Upload Final Setup
        uses: actions/upload-artifact@v4
        with:
          name: Custom-RustDesk-Installer
          path: CustomRustDesk_Setup.exe
